<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F0F1A"/>
      <stop offset="100%" style="stop-color:#1A1530"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7E67F8"/>
      <stop offset="100%" style="stop-color:#A890FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines subtle -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Accent circle top right -->
  <circle cx="1050" cy="120" r="200" fill="rgba(126,103,248,0.08)"/>
  <circle cx="1050" cy="120" r="130" fill="rgba(126,103,248,0.06)"/>

  <!-- Accent circle bottom left -->
  <circle cx="100" cy="530" r="150" fill="rgba(126,103,248,0.05)"/>

  <!-- Left bar accent -->
  <rect x="80" y="180" width="6" height="120" rx="3" fill="url(#accent)"/>

  <!-- Logo text -->
  <text x="110" y="272" font-family="Georgia, serif" font-size="88" font-weight="700" letter-spacing="-3" fill="white">Zaid</text>
  <text x="340" y="272" font-family="Georgia, serif" font-size="88" font-weight="700" letter-spacing="-3" fill="url(#accent)">ly</text>

  <!-- Tagline -->
  <text x="110" y="320" font-family="Arial, sans-serif" font-size="22" letter-spacing="6" fill="rgba(255,255,255,0.5)" text-transform="uppercase">DIGITAL AGENCY</text>

  <!-- Divider -->
  <rect x="80" y="350" width="500" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Sub text -->
  <text x="80" y="395" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.65)">Jasa Website Profesional untuk UMKM Indonesia</text>

  <!-- Pills -->
  <rect x="80" y="430" width="160" height="38" rx="19" fill="rgba(126,103,248,0.2)" stroke="rgba(126,103,248,0.4)" stroke-width="1"/>
  <text x="160" y="454" font-family="Arial, sans-serif" font-size="14" fill="#A890FF" text-anchor="middle">WordPress</text>

  <rect x="255" y="430" width="130" height="38" rx="19" fill="rgba(126,103,248,0.2)" stroke="rgba(126,103,248,0.4)" stroke-width="1"/>
  <text x="320" y="454" font-family="Arial, sans-serif" font-size="14" fill="#A890FF" text-anchor="middle">SEO Ready</text>

  <rect x="400" y="430" width="140" height="38" rx="19" fill="rgba(126,103,248,0.2)" stroke="rgba(126,103,248,0.4)" stroke-width="1"/>
  <text x="470" y="454" font-family="Arial, sans-serif" font-size="14" fill="#A890FF" text-anchor="middle">Fast Loading</text>

  <!-- URL -->
  <text x="80" y="560" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.3)" letter-spacing="1">zaidly.com</text>

  <!-- Right decorative element -->
  <rect x="920" y="180" width="2" height="270" fill="rgba(126,103,248,0.3)"/>
  <text x="950" y="280" font-family="Arial, sans-serif" font-size="110" font-weight="700" fill="rgba(126,103,248,0.07)" letter-spacing="-5">WEB</text>
  <text x="950" y="390" font-family="Arial, sans-serif" font-size="110" font-weight="700" fill="rgba(126,103,248,0.07)" letter-spacing="-5">DEV</text>
</svg>
